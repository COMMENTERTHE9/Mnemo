[project]
name = "mnemo"
version = "0.2.0"
description = "Bio-inspired video memory system (Python rebuild)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.13",
    "opencv-python-headless>=4.10",
    "numpy>=1.26,<2.0",
    "mediapipe==0.10.14",
    "yt-dlp>=2024.10.0",
]

[project.scripts]
mnemo = "mnemo.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mnemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
